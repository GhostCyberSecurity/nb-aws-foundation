<svg viewBox="0 0 1600 1280" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="1280" fill="#ffffff"/>

  <text x="800" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Secure AWS Foundation — Architecture &amp; Trust Boundaries</text>
  <text x="800" y="56" text-anchor="middle" font-size="13" fill="#64748b">Northeast Bank technical exercise — nb-exercise (temporary account)</text>

  <!-- ===== Actor: security engineer, OUTSIDE the account boundary ===== -->
  <g>
    <circle cx="95" cy="1195" r="16" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
    <path d="M70,1240 Q95,1205 120,1240 Z" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
    <text x="95" y="1262" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Security engineer</text>
    <text x="95" y="1276" text-anchor="middle" font-size="11" fill="#64748b">(MFA-authenticated)</text>
  </g>

  <!-- ===== Outer: AWS Account boundary ===== -->
  <rect x="20" y="80" width="1560" height="1080" rx="14" fill="none" stroke="#475569" stroke-width="2.5" stroke-dasharray="10 5"/>
  <text x="40" y="108" font-size="16" font-weight="700" fill="#1e293b">AWS Account boundary — nb-exercise</text>

  <!-- ===== VPC boundary ===== -->
  <rect x="55" y="130" width="1000" height="700" rx="12" fill="#f8fafc" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="75" y="158" font-size="15" font-weight="700" fill="#1d4ed8">VPC — 10.0.0.0/16</text>
  <text x="75" y="176" font-size="11.5" font-style="italic" fill="#475569">No NAT Gateway — private subnet reaches AWS only through VPC endpoints</text>

  <!-- IGW -->
  <rect x="490" y="190" width="90" height="34" rx="6" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="535" y="211" text-anchor="middle" font-size="11.5" font-weight="600" fill="#3730a3">IGW</text>

  <!-- AZ A -->
  <rect x="85" y="245" width="450" height="565" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="105" y="270" font-size="13" font-weight="700" fill="#334155">Availability Zone A</text>

  <rect x="105" y="285" width="410" height="80" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="120" y="305" font-size="11.5" font-weight="600" fill="#92400e">Public Subnet — 10.0.0.0/24</text>
  <text x="120" y="322" font-size="10.5" font-style="italic" fill="#92400e">Reserved — no active resources in this exercise</text>

  <rect x="105" y="380" width="410" height="410" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="120" y="400" font-size="11.5" font-weight="600" fill="#065f46">Private Subnet (isolated) — 10.0.2.0/24</text>

  <rect x="125" y="415" width="185" height="110" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="217" y="435" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">EC2 t3.micro</text>
  <text x="217" y="452" text-anchor="middle" font-size="10.5" fill="#1e40af">SSM-managed instance</text>
  <text x="217" y="467" text-anchor="middle" font-size="10.5" fill="#1e40af">IMDSv2 required</text>
  <text x="217" y="482" text-anchor="middle" font-size="10.5" fill="#1e40af">No public IP</text>
  <text x="217" y="497" text-anchor="middle" font-size="10.5" fill="#1e40af">EBS: KMS encrypted</text>
  <text x="217" y="512" text-anchor="middle" font-size="10.5" fill="#1e40af">SG: 0 inbound rules</text>

  <text x="120" y="548" font-size="11" font-weight="600" fill="#065f46">VPC Endpoints (private-subnet reachability):</text>
  <rect x="125" y="558" width="90" height="46" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="170" y="577" text-anchor="middle" font-size="9.5" font-weight="600" fill="#5b21b6">SSM</text>
  <text x="170" y="590" text-anchor="middle" font-size="8.5" fill="#5b21b6">interface</text>
  <rect x="222" y="558" width="90" height="46" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="267" y="573" text-anchor="middle" font-size="8.5" font-weight="600" fill="#5b21b6">SSMMessages</text>
  <text x="267" y="586" text-anchor="middle" font-size="8.5" fill="#5b21b6">interface</text>
  <rect x="319" y="558" width="90" height="46" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="364" y="573" text-anchor="middle" font-size="8.5" font-weight="600" fill="#5b21b6">EC2Messages</text>
  <text x="364" y="586" text-anchor="middle" font-size="8.5" fill="#5b21b6">interface</text>
  <rect x="125" y="614" width="284" height="46" rx="5" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.2"/>
  <text x="267" y="633" text-anchor="middle" font-size="9.5" font-weight="600" fill="#0f766e">S3 Gateway Endpoint</text>
  <text x="267" y="646" text-anchor="middle" font-size="8.5" fill="#0f766e">patch repos, SSM agent deps</text>

  <text x="120" y="682" font-size="9.5" fill="#065f46">SG egress: 443 → VPC CIDR + S3 prefix list only</text>
  <text x="120" y="696" font-size="9.5" fill="#065f46">NACL: 443 in/out only, default-deny otherwise</text>
  <text x="120" y="712" font-size="9.5" fill="#065f46">Session Manager I/O → encrypted CloudWatch Logs</text>
  <text x="120" y="726" font-size="9.5" fill="#065f46">(20 min idle / 60 min max session)</text>

  <!-- AZ B -->
  <rect x="555" y="245" width="480" height="565" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="575" y="270" font-size="13" font-weight="700" fill="#334155">Availability Zone B</text>

  <rect x="575" y="285" width="440" height="80" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="590" y="305" font-size="11.5" font-weight="600" fill="#92400e">Public Subnet — 10.0.1.0/24</text>
  <text x="590" y="322" font-size="10.5" font-style="italic" fill="#92400e">Reserved — no active resources in this exercise</text>

  <rect x="575" y="380" width="440" height="410" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="590" y="400" font-size="11.5" font-weight="600" fill="#065f46">Private Subnet (isolated) — 10.0.3.0/24</text>
  <text x="590" y="418" font-size="10.5" font-style="italic" fill="#065f46">Endpoints only — HA for reachability; no compute here</text>

  <rect x="595" y="440" width="90" height="46" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="640" y="459" text-anchor="middle" font-size="9.5" font-weight="600" fill="#5b21b6">SSM</text>
  <text x="640" y="472" text-anchor="middle" font-size="8.5" fill="#5b21b6">interface</text>
  <rect x="692" y="440" width="90" height="46" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="737" y="455" text-anchor="middle" font-size="8.5" font-weight="600" fill="#5b21b6">SSMMessages</text>
  <text x="737" y="468" text-anchor="middle" font-size="8.5" fill="#5b21b6">interface</text>
  <rect x="789" y="440" width="90" height="46" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="834" y="455" text-anchor="middle" font-size="8.5" font-weight="600" fill="#5b21b6">EC2Messages</text>
  <text x="834" y="468" text-anchor="middle" font-size="8.5" fill="#5b21b6">interface</text>
  <rect x="595" y="496" width="284" height="46" rx="5" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.2"/>
  <text x="737" y="515" text-anchor="middle" font-size="9.5" font-weight="600" fill="#0f766e">S3 Gateway Endpoint</text>
  <text x="737" y="528" text-anchor="middle" font-size="8.5" fill="#0f766e">shared route, AZ-resilient</text>

  <!-- IGW connections -->
  <line x1="510" y1="224" x2="310" y2="285" stroke="#4338ca" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="560" y1="224" x2="795" y2="285" stroke="#4338ca" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== Right column: Logging / Detection / Compliance ===== -->
  <text x="1085" y="158" font-size="15" font-weight="700" fill="#166534">Logging, Detection &amp; Compliance</text>

  <rect x="1075" y="175" width="470" height="50" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="1310" y="196" text-anchor="middle" font-size="11.5" font-weight="700" fill="#065f46">CloudTrail (multi-region, file validation, → CloudWatch too)</text>
  <text x="1310" y="212" text-anchor="middle" font-size="9.5" fill="#065f46">CMK: nb-exercise/cloudtrail</text>

  <rect x="1075" y="245" width="470" height="60" rx="6" fill="#bbf7d0" stroke="#059669" stroke-width="2"/>
  <text x="1310" y="268" text-anchor="middle" font-size="12" font-weight="700" fill="#064e3b">S3: CloudTrail + Config (prefix: config/)</text>
  <text x="1310" y="284" text-anchor="middle" font-size="9.5" fill="#064e3b">Versioned · KMS-CMK · BlockPublicAccess:ALL · TLS-only · ACLs disabled</text>
  <text x="1310" y="298" text-anchor="middle" font-size="9.5" fill="#064e3b">bucket policy: least-privilege per principal, no wildcard s3:*</text>

  <rect x="1075" y="320" width="150" height="42" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="1150" y="338" text-anchor="middle" font-size="9.5" font-weight="600" fill="#166534">CW: Flow Logs</text>
  <text x="1150" y="352" text-anchor="middle" font-size="8.5" fill="#166534">CMK: vpc-flow-logs</text>
  <rect x="1235" y="320" width="150" height="42" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="1310" y="338" text-anchor="middle" font-size="9.5" font-weight="600" fill="#166534">CW: CloudTrail</text>
  <text x="1310" y="352" text-anchor="middle" font-size="8.5" fill="#166534">near-real-time search</text>
  <rect x="1395" y="320" width="150" height="42" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="1470" y="338" text-anchor="middle" font-size="9.5" font-weight="600" fill="#166534">CW: Session Logs</text>
  <text x="1470" y="352" text-anchor="middle" font-size="8.5" fill="#166534">CMK: compute</text>

  <rect x="1075" y="385" width="225" height="55" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="1187" y="407" text-anchor="middle" font-size="11.5" font-weight="700" fill="#991b1b">GuardDuty</text>
  <text x="1187" y="422" text-anchor="middle" font-size="9" fill="#991b1b">15-min findings · EBS malware protection</text>
  <text x="1187" y="435" text-anchor="middle" font-size="9" fill="#991b1b">S3 data events</text>

  <rect x="1320" y="385" width="225" height="55" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="1432" y="407" text-anchor="middle" font-size="11.5" font-weight="700" fill="#92400e">AWS Config</text>
  <text x="1432" y="422" text-anchor="middle" font-size="9" fill="#92400e">8 curated rules, one per control below</text>
  <text x="1432" y="435" text-anchor="middle" font-size="9" fill="#92400e">→ delivers to S3 config/ prefix</text>

  <rect x="1150" y="470" width="270" height="48" rx="6" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
  <text x="1285" y="491" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">SNS: Security Alerts</text>
  <text x="1285" y="507" text-anchor="middle" font-size="9" fill="#7f1d1d">GuardDuty HIGH findings + break-glass use</text>

  <!-- arrows in logging column -->
  <line x1="1310" y1="225" x2="1310" y2="245" stroke="#166534" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1150" y1="320" x2="1240" y2="305" stroke="#166534" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="1310" y1="320" x2="1310" y2="305" stroke="#166534" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="1432" y1="440" x2="1330" y2="305" stroke="#92400e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="1220" y1="440" x2="1275" y2="470" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <!-- ===== Identity strip ===== -->
  <text x="85" y="865" font-size="15" font-weight="700" fill="#7c2d12">Identity — role-only access, MFA-gated at the trust policy</text>

  <rect x="85" y="880" width="470" height="90" rx="8" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/>
  <text x="320" y="905" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7c2d12">nb-exercise-breakglass-admin</text>
  <text x="320" y="923" text-anchor="middle" font-size="10" fill="#7c2d12">AdministratorAccess · MFA required in trust policy</text>
  <text x="320" y="939" text-anchor="middle" font-size="10" fill="#7c2d12">Max session: 1 hour · every AssumeRole → SNS alert</text>
  <text x="320" y="955" text-anchor="middle" font-size="10" fill="#7c2d12">emergency use only</text>

  <rect x="575" y="880" width="470" height="90" rx="8" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="810" y="905" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">nb-exercise-security-auditor</text>
  <text x="810" y="923" text-anchor="middle" font-size="10" fill="#1e3a8a">ReadOnlyAccess + SecurityAudit · MFA required</text>
  <text x="810" y="939" text-anchor="middle" font-size="10" fill="#1e3a8a">Max session: 4 hours</text>
  <text x="810" y="955" text-anchor="middle" font-size="10" fill="#1e3a8a">no write access, no workload data access</text>

  <text x="85" y="998" font-size="10.5" font-style="italic" fill="#475569">Root account: MFA + no access keys + no routine use — manual, one-time hardening (see README). Not modeled in CDK; account-level, not stack-level.</text>

  <!-- actor -> roles, crossing the account boundary -->
  <line x1="120" y1="1180" x2="280" y2="970" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="150" y1="1195" x2="700" y2="970" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="150" y="1090" font-size="10.5" font-weight="600" fill="#334155">AssumeRole (MFA required)</text>

  <!-- break-glass -> SNS alert: routed above both role boxes, then through the gap between the VPC box and the right column -->
  <path d="M500,880 L500,850 L1062,850 L1062,494 L1145,494" fill="none" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#arrowRed)"/>
  <text x="900" y="843" font-size="9.5" fill="#b91c1c" font-style="italic">every assumption → alert</text>

  <!-- ===== Legend ===== -->
  <rect x="1075" y="550" width="480" height="220" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="1095" y="575" font-size="12.5" font-weight="700" fill="#1e293b">Legend</text>

  <rect x="1095" y="590" width="26" height="16" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="4 2"/>
  <text x="1130" y="602" font-size="10.5" fill="#334155">Trust boundary (account / VPC / subnet)</text>

  <line x1="1095" y1="622" x2="1121" y2="622" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="1130" y="626" font-size="10.5" fill="#334155">Data / control flow</text>

  <line x1="1095" y1="644" x2="1121" y2="644" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="4 2" marker-end="url(#arrowRed)"/>
  <text x="1130" y="648" font-size="10.5" fill="#334155">Alerting flow</text>

  <rect x="1095" y="662" width="26" height="16" fill="#dbeafe" stroke="#2563eb"/>
  <text x="1130" y="674" font-size="10.5" fill="#334155">Compute / networking</text>

  <rect x="1095" y="684" width="26" height="16" fill="#d1fae5" stroke="#059669"/>
  <text x="1130" y="696" font-size="10.5" fill="#334155">Logging / audit trail</text>

  <rect x="1095" y="706" width="26" height="16" fill="#fee2e2" stroke="#dc2626"/>
  <text x="1130" y="718" font-size="10.5" fill="#334155">Threat detection / alerting</text>

  <rect x="1095" y="728" width="26" height="16" fill="#fed7aa" stroke="#c2410c"/>
  <text x="1130" y="740" font-size="10.5" fill="#334155">Identity (MFA-gated roles)</text>

  <text x="1095" y="760" font-size="9.5" font-style="italic" fill="#64748b">3 dedicated CMKs: flow-logs, cloudtrail, compute (EBS+session logs)</text>

</svg>
